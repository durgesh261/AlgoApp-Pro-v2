version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: algoapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: algo_user
      POSTGRES_PASSWORD: algo_password
      POSTGRES_DB: algoapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo_user -d algoapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: algoapp_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      APP_PORT: 4000
      DATABASE_URL: postgresql://algo_user:algo_password@postgres:5432/algoapp_db?schema=public
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: algoapp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
