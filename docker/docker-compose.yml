version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: quantedge_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      APP_PORT: 4000
      DATABASE_URL: file:/data/quantedge.db
      CORS_ORIGIN: http://localhost:3000
      DELTA_ENVIRONMENT: PRODUCTION
    volumes:
      - sqlite_data:/data
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/system/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: quantedge_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    # Optional: mount nginx.conf for live editing in dev
    # volumes:
    #   - ../nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  sqlite_data:
    driver: local
  logs:
    driver: local
